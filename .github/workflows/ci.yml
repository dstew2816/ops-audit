name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Audit, SPC, impact and scorer checks, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # db:check, spc:check, impact:check and both scorer self-tests (no API calls)
      - run: npm run check
      - run: npm run build

  ml:
    name: Machine learning pipeline smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r ml/requirements.txt
      # small fixed-seed run plus reproducibility checks on the committed artefacts
      - run: python ml/ci_smoke.py
